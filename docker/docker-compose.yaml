version: '3.4'
services:
  oracle:
    image: gvenzl/oracle-free:23.26.3-slim
    container_name: etl-oracle
    ports:
      - "1521:1521"

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ETL_TARGET
      APP_USER_PASSWORD: ${ETL_TARGET_PASSWORD}

    volumes:
      - oracle-data:/opt/oracle/oradata
      - ../DDL/Oracle:/container-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  

volumes:
  oracle-data:

networks:
  default:
    name: oracle
